<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="1256" viewBox="0 0 1256 1256">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071b49" stop-opacity=".97"/>
      <stop offset=".72" stop-color="#0b2d6b" stop-opacity=".88"/>
      <stop offset="1" stop-color="#0b2d6b" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001238" flood-opacity=".22"/>
    </filter>
  </defs>
  <image href="driver-recruitment-background-v1.png" x="0" y="0" width="1256" height="1256" preserveAspectRatio="xMidYMid slice"/>
  <rect width="790" height="1256" fill="url(#panel)"/>

  <g font-family="Tahoma, Leelawadee UI, sans-serif" fill="#fff">
    <g transform="translate(72 54)">
      <rect width="168" height="54" rx="27" fill="#ff8a1f"/>
      <text x="84" y="37" text-anchor="middle" font-size="25" font-weight="700">เปิดรับสมัคร</text>
      <text x="190" y="35" font-size="18" fill="#b9d6ff">ร่างแก้ไขได้ · DEMO-001</text>
    </g>

    <text x="72" y="177" font-size="34" font-weight="700" fill="#b9d6ff">ร่วมงานกับเรา</text>
    <text x="72" y="251" font-size="64" font-weight="700">พนักงานขับรถ</text>
    <text x="72" y="303" font-size="21" fill="#d9e7ff">ตัวอย่างการตีความตำแหน่งจาก Job Family: Driver</text>

    <g transform="translate(72 337)">
      <rect width="570" height="114" rx="26" fill="#ff8a1f"/>
      <text x="30" y="43" font-size="21" font-weight="700">รายได้ตามใบงาน</text>
      <text x="30" y="88" font-size="48" font-weight="700">12,000 บาท</text>
      <rect x="407" y="27" width="132" height="60" rx="18" fill="#fff" fill-opacity=".2"/>
      <text x="473" y="64" text-anchor="middle" font-size="22" font-weight="700">รับ 1 อัตรา</text>
    </g>

    <g transform="translate(72 474)" font-size="22">
      <rect width="570" height="339" rx="28" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".22"/>
      <text x="30" y="43" font-weight="700" fill="#b9d6ff">คุณสมบัติตามใบงาน</text>
      <g transform="translate(30 60)">
        <rect width="115" height="43" rx="16" fill="#fff" fill-opacity=".14"/><text x="57" y="29" text-anchor="middle" font-size="18">เพศชาย</text>
        <rect x="127" width="153" height="43" rx="16" fill="#fff" fill-opacity=".14"/><text x="203" y="29" text-anchor="middle" font-size="18">อายุ 25–45 ปี</text>
        <rect x="292" width="208" height="43" rx="16" fill="#fff" fill-opacity=".14"/><text x="396" y="29" text-anchor="middle" font-size="18">ข้อมูลตัวอย่าง</text>
      </g>
      <line x1="30" x2="540" y1="123" y2="123" stroke="#fff" stroke-opacity=".22"/>
      <text x="30" y="160" font-weight="700" fill="#b9d6ff">สถานที่ปฏิบัติงาน</text>
      <text x="30" y="194" font-size="20">ตัวอย่าง: โรงพยาบาลเอกชน เขตห้วยขวาง</text>
      <text x="30" y="224" font-size="20">กรุงเทพฯ</text>
      <line x1="30" x2="540" y1="246" y2="246" stroke="#fff" stroke-opacity=".22"/>
      <text x="30" y="281" font-weight="700" fill="#b9d6ff">วันและเวลาทำงาน</text>
      <text x="30" y="313" font-size="19">จันทร์–อาทิตย์ ตามตารางกะ · ทำงาน 10 ชม.</text>
      <text x="30" y="337" font-size="16" fill="#d9e7ff">รวมพัก และ OT เหมา 1 ชม. ตามข้อมูลในใบงาน</text>
    </g>

    <g transform="translate(72 840)" filter="url(#shadow)">
      <rect width="570" height="106" rx="24" fill="#ff8a1f"/>
      <text x="285" y="43" text-anchor="middle" font-size="22" font-weight="700">สนใจสมัครงาน</text>
      <text x="285" y="78" text-anchor="middle" font-size="29" font-weight="700">ติดต่อทีมสรรหา SO</text>
    </g>

    <g transform="translate(72 1065)">
      <image href="../logo-SO.webp" width="135" height="68" preserveAspectRatio="xMidYMid meet"/>
      <text x="158" y="29" font-size="22" font-weight="700">Siamrajathanee</text>
      <text x="158" y="57" font-size="18" fill="#b9d6ff">โอกาสงานที่ตรงกับคุณ</text>
    </g>
  </g>
</svg>
